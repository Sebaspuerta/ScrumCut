{% partialdef link %}
{# aria-label conserva el nombre cuando el menú se contrae y solo quedan los íconos. #}
{% if link.url %}
<a class="{{ css }}" href="{{ link.url }}" title="{{ link.label }}"{% if link.active %} aria-current="page"{% endif %}
{% else %}
<a class="{{ css }}" aria-disabled="true" title="{{ link.label }} · Próximamente"
{% endif %}
   aria-label="{{ link.label }}{% if link.key == 'alertas' and shell.unread_alerts %}: {{ shell.unread_alerts }} sin leer{% endif %}">
  <span class="icon" aria-hidden="true">{% include link.icon %}</span>
  <span class="{{ css }}__label">{{ link.label }}</span>
  {% if link.key == "alertas" and shell.unread_alerts %}<span class="nav-count num" aria-hidden="true">{{ shell.unread_alerts }}</span>{% endif %}
</a>
{% endpartialdef %}
