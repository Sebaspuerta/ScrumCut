{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block meta %}{% endblock %}
  <title>{% block head_title %}ScrumCut{% endblock %}</title>
  <link rel="icon" href="{% static 'brand/icon.svg' %}" type="image/svg+xml">
  <link rel="manifest" href="{% static 'brand/site.webmanifest' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/fields.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/states.css' %}">
  {% block styles %}{% endblock %}
  <script type="module" src="{% static 'js/modules/notices.js' %}"></script>
  {% block scripts %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block extra_body %}{% endblock %}
</body>
</html>
